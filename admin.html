<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پانێڵی سکرتێر - بەڕێوەبردنی نۆرەکان</title>
    <!-- گووگڵ فۆنت بۆ فۆنتی کەیوان/کوردی خاوێن -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap">
    <!-- ئایکۆنەکانی FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #0d9488;
            --accent-hover: #0f766e;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            direction: rtl;
            min-height: 100vh;
        }

        /* هێدەر */
        .admin-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-header h1 i {
            color: var(--accent-color);
        }

        .btn-back {
            color: #e2e8f0;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            transform: translateX(3px);
        }

        /* بەشی لۆگین */
        .login-container {
            max-width: 420px;
            margin: 5rem auto;
            padding: 0 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            background: #f0fdfa;
            color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.5rem auto;
        }

        .login-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(13, 148, 136, 0.25);
        }

        /* بەشی داشبۆرد */
        .container {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        /* ئامارەکان */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-info .stat-label {
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
        }

        .stat-info .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 0.3rem;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-card.today .stat-icon {
            background: #ecfdf5;
            color: var(--success-color);
        }

        .stat-card.month .stat-icon {
            background: #f0fdfa;
            color: var(--accent-color);
        }

        .stat-card.year .stat-icon {
            background: #f3e8ff;
            color: #9333ea;
        }

        .stat-card.total .stat-icon {
            background: #fff7ed;
            color: #ea580c;
        }

        /* خشتەی نۆرەکان */
        .card-table {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .table-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.93rem;
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        /* بەج و دوگمەکان */
        .status-badge {
            padding: 0.35rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #d97706;
        }

        .status-approved {
            background-color: #d1fae5;
            color: #059669;
        }

        .status-rescheduled {
            background-color: #e0f2fe;
            color: #0284c7;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            border: none;
            padding: 0.45rem 0.8rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-approve {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        .btn-approve:hover {
            background-color: #10b981;
            color: white;
        }

        .btn-delay {
            background-color: #fff7ed;
            color: #c2410c;
            border: 1px solid #ffedd5;
        }

        .btn-delay:hover {
            background-color: #ea580c;
            color: white;
        }

        .btn-delete {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .btn-delete:hover {
            background-color: #ef4444;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 1rem;
            }

            .container {
                padding: 0 1rem;
                margin: 1.5rem auto;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- هێدەری سەرەوە -->
    <header class="admin-header">
        <h1><i class="fa-solid fa-user-doctor"></i> پانێڵی بەڕێوەبردنی سکرتێر</h1>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> گەڕانەوە بۆ ماڵپەڕ</a>
    </header>

    <!-- بەشی چوونەژوورەوەی سکرتێر -->
    <div id="loginBox" class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>چوونەژوورەوە</h2>
            <p>تکایە وشەی تێپەڕ بنووسە بۆ گەیشتن بە نۆرەکان</p>
            <div class="input-group">
                <input type="password" id="adminPassword" placeholder="••••" autofocus>
            </div>
            <button id="loginBtn" class="btn-primary">چوونەژوورەوە <i class="fa-solid fa-right-to-bracket"></i></button>
            <p id="loginError" style="color: var(--danger-color); margin-top: 1rem; font-size: 0.85rem;" class="hidden">
                <i class="fa-solid fa-circle-exclamation"></i> وشەی تێپەڕ هەڵەیە!
            </p>
        </div>
    </div>

    <!-- بەشی سەرەکی داشبۆرد -->
    <main id="adminContent" class="container hidden">

        <!-- سندوقەکانی ئامار (Analytics Cards) -->
        <div class="stats-grid">
            <div class="stat-card today">
                <div class="stat-info">
                    <div class="stat-label">نۆرەکانی ئەمڕۆ</div>
                    <div class="stat-number" id="todayCount">0</div>
                </div>
                <div class="stat-icon"><i class="fa-solid fa-calendar-day"></i></div>
            </div>
            <div class="stat-card month">
                <div class="stat-info">
                    <div class="stat-label">نۆرەکانی ئەم مانگە</div>
                    <div class="stat-number" id="monthCount">0</div>
                </div>
                <div class="stat-icon"><i class="fa-solid fa-calendar-week"></i></div>
            </div>
            <div class="stat-card year">
                <div class="stat-info">
                    <div class="stat-label">نۆرەکانی ئەم ساڵە</div>
                    <div class="stat-number" id="yearCount">0</div>
                </div>
                <div class="stat-icon"><i class="fa-solid fa-calendar-days"></i></div>
            </div>
            <div class="stat-card total">
                <div class="stat-info">
                    <div class="stat-label">کۆی گشتی نۆرەکان</div>
                    <div class="stat-number" id="totalCount">0</div>
                </div>
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
            </div>
        </div>

        <!-- خشتەی زانیارییەکان -->
        <section class="card-table">
            <div class="table-header">
                <h2><i class="fa-solid fa-list-check" style="color: var(--accent-color);"></i> لیستی تەواوی نۆرەکان</h2>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ناو</th>
                            <th>تەلەفۆن</th>
                            <th>بەرواری داواکراو</th>
                            <th>تێبینی</th>
                            <th>بارودۆخ</th>
                            <th>کردارەکان</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsList">
                        <!-- داتاکان ئۆتۆماتیکی باردەکرێن -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("loginBtn");
            const adminPasswordInput = document.getElementById("adminPassword");

            loginBtn.addEventListener("click", checkPassword);

            adminPasswordInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    checkPassword();
                }
            });
        });

        function checkPassword() {
            const passwordInput = document.getElementById("adminPassword").value;
            const loginBox = document.getElementById("loginBox");
            const adminContent = document.getElementById("adminContent");
            const loginError = document.getElementById("loginError");

            if (passwordInput === "1234") {
                loginBox.classList.add("hidden");
                adminContent.classList.remove("hidden");
                renderAppointments();
            } else {
                loginError.classList.remove("hidden");
            }
        }

        function calculateStats(appointments) {
            const todayStr = new Date().toISOString().split('T')[0];
            const currentMonthStr = todayStr.substring(0, 7);
            const currentYearStr = todayStr.substring(0, 4);

            let todayCount = 0;
            let monthCount = 0;
            let yearCount = 0;

            appointments.forEach(app => {
                if (app.date) {
                    if (app.date === todayStr) todayCount++;
                    if (app.date.startsWith(currentMonthStr)) monthCount++;
                    if (app.date.startsWith(currentYearStr)) yearCount++;
                }
            });

            document.getElementById("todayCount").innerText = todayCount;
            document.getElementById("monthCount").innerText = monthCount;
            document.getElementById("yearCount").innerText = yearCount;
            document.getElementById("totalCount").innerText = appointments.length;
        }

        function renderAppointments() {
            const appointmentsList = document.getElementById("appointmentsList");
            if (!appointmentsList) return;

            let appointments = JSON.parse(localStorage.getItem("doctor_appointments")) || [];

            calculateStats(appointments);

            appointmentsList.innerHTML = "";

            if (appointments.length === 0) {
                appointmentsList.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fa-regular fa-folder-open"></i>
                                <p>هیچ داواکارییەکی نۆرە لە سیستەمدا نییە.</p>
                            </div>
                        </td>
                    </tr>`;
                return;
            }

            appointments.forEach(app => {
                let statusBadge = `<span class="status-badge status-pending"><i class="fa-regular fa-clock"></i> چاوەڕوانکراوە</span>`;
                if (app.status === "تەئکیدکرایەوە") {
                    statusBadge = `<span class="status-badge status-approved"><i class="fa-solid fa-check"></i> تەئکیدکراوە</span>`;
                } else if (app.status.includes("داواکراوە")) {
                    statusBadge = `<span class="status-badge status-rescheduled"><i class="fa-solid fa-arrows-rotate"></i> ${app.status}</span>`;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${app.fullName}</strong></td>
                    <td style="direction: ltr; text-align: right;">${app.phone}</td>
                    <td><i class="fa-regular fa-calendar" style="color: var(--text-muted); margin-left: 5px;"></i> ${app.date}</td>
                    <td style="color: var(--text-muted); font-size: 0.88rem;">${app.notes}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-action btn-approve" onclick="changeStatus(${app.id}, 'تەئکیدکرایەوە')"><i class="fa-solid fa-check"></i> قبوڵ</button>
                            <button class="btn-action btn-delay" onclick="changeStatus(${app.id}, 'پاشخرا')"><i class="fa-solid fa-pen"></i> گۆڕین</button>
                            <button class="btn-action btn-delete" onclick="deleteAppointment(${app.id})"><i class="fa-solid fa-trash"></i> سڕینەوە</button>
                        </div>
                    </td>
                `;
                appointmentsList.appendChild(tr);
            });
        }

        function changeStatus(id, action) {
            let appointments = JSON.parse(localStorage.getItem("doctor_appointments")) || [];

            appointments = appointments.map(app => {
                if (app.id === id) {
                    if (action === 'تەئکیدکرایەوە') {
                        app.status = 'تەئکیدکرایەوە';
                    } else if (action === 'پاشخرا') {
                        const newDate = prompt("تکایە بەروارێکی نوێ دیاری بکە (نموونە: 2026-05-20):");
                        if (newDate) {
                            app.date = newDate;
                            app.status = `داواکراوە (${newDate})`;
                        }
                    }
                }
                return app;
            });

            localStorage.setItem("doctor_appointments", JSON.stringify(appointments));
            renderAppointments();
        }

        function deleteAppointment(id) {
            if (confirm("ئایا دڵنیایت لە سڕینەوەی ئەم نۆرەیە؟")) {
                let appointments = JSON.parse(localStorage.getItem("doctor_appointments")) || [];
                appointments = appointments.filter(app => app.id !== id);
                localStorage.setItem("doctor_appointments", JSON.stringify(appointments));
                renderAppointments();
            }
        }
    </script>
</body>

</html>
