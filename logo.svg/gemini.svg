<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- گڕادیێنتی پاشبنەما -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- گڕادیێنتی ئایکۆنە پزیشکییەکە -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- سێبەری نەرم -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- بازنەی پاشبنەما (کارت/ئایکۆن) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- حەڵقەی ڕازاندنەوەی دەوروبەر -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="12" />

  <!-- نیشانەی سەرەکی (تێکەڵەی صلیبی پزیشکی و کاتژمێری نۆرە) -->
  <g filter="url(#glow)">
    <!-- صلیبی پزیشکی بە گۆشەی بازنەیی -->
    <path d="M216,116 H296 A20,20 0 0 1 316,136 V216 H396 A20,20 0 0 1 416,236 V316 A20,20 0 0 1 396,336 H316 V416 A20,20 0 0 1 296,436 H216 A20,20 0 0 1 196,416 V336 H116 A20,20 0 0 1 96,316 V236 A20,20 0 0 1 116,216 H196 V136 A20,20 0 0 1 216,116 Z" fill="url(#iconGrad)" />

    <!-- ئایکۆنی سەعات و پێکان لە ڕاستییەکەدا (لە ناوەڕاستی لۆگۆکەدا) -->
    <circle cx="256" cy="276" r="45" fill="#0f172a" />
    <path d="M256,246 V276 H278" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- خاڵەکانی دیارییکردنی نۆرە -->
    <circle cx="256" cy="160" r="10" fill="#ffffff" opacity="0.9" />
    <circle cx="352" cy="276" r="10" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
